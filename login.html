<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - My Web Page</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-wrapper">
            <div class="login-card">
                <!-- Login Header -->
                <div class="login-header">
                    <h2>Welcome Back</h2>
                    <p>Sign in to continue to your account</p>
                </div>

                <!-- Login Form -->
                <div class="login-body">
                    <form action="login_process.html" method="post">
                        <div class="form-group">
                            <label for="username">Username or Email</label>
                            <input type="text" id="username" name="username" placeholder="Enter your username or email" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        </div>

                        <div class="form-options">
                            <label class="remember-me">
                                <input type="checkbox" name="remember">
                                Remember me
                            </label>
                            <a href="forgot-password.html" class="forgot-password">Forgot password?</a>
                        </div>

                        <button type="submit" class="login-btn">Sign In</button>
                    </form>

                    <!-- Divider -->
                    <div class="login-divider">
                        <span>or continue with</span>
                    </div>

                    <!-- Social Login -->
                    <div class="social-login">
                        <a href="https://www.facebook.com" target="_blank" title="Facebook">
                            <i class="fab fa-facebook-f"></i>
                        </a>
                        <a href="https://www.twitter.com" target="_blank" title="Twitter">
                            <i class="fab fa-twitter-x"></i>
                        </a>
                        <a href="https://www.linkedin.com" target="_blank" title="LinkedIn">
                            <i class="fab fa-linkedin-in"></i>
                        </a>
                        <a href="https://www.instagram.com" target="_blank" title="Instagram">
                            <i class="fab fa-instagram"></i>
                        </a>
                        <a href="https://www.youtube.com" target="_blank" title="YouTube">
                            <i class="fab fa-youtube"></i>
                        </a>
                        <a href="https://www.github.com" target="_blank" title="GitHub">
                            <i class="fab fa-github"></i>
                        </a>
                        <a href="https://www.google.com" target="_blank" title="Google">
                            <i class="fab fa-google"></i>
                        </a>
                    </div>
                </div>

                <!-- Login Footer -->
                <div class="login-footer">
                    <p>Don't have an account? <a href="signup.html">Sign up now</a></p>
                    <a href="index.html" class="back-home">
                        ← Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
