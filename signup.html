<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - My Web Page</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-wrapper">
            <div class="login-card">
                <!-- Signup Header -->
                <div class="login-header">
                    <h2>Create Account</h2>
                    <p>Join us and start your journey</p>
                </div>

                <!-- Signup Form -->
                <div class="login-body">
                    <form action="signup_process.html" method="post">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" name="username" placeholder="Choose a username" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="Create a password" required>
                        </div>

                        <div class="form-group">
                            <label for="confirm-password">Confirm Password</label>
                            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
                        </div>

                        <div class="form-options">
                            <label class="remember-me">
                                <input type="checkbox" name="terms" required>
                                I agree to the <a href="terms.html">Terms of Service</a>
                            </label>
                        </div>

                        <button type="submit" class="login-btn">Create Account</button>
                    </form>

                    <!-- Divider -->
                    <div class="login-divider">
                        <span>or continue with</span>
                    </div>

                    <!-- Social Login -->
                    <div class="social-login">
                        <a href="https://www.facebook.com" target="_blank" title="Facebook">
                            <i class="fab fa-facebook-f"></i>
                        </a>
                        <a href="https://www.twitter.com" target="_blank" title="Twitter">
                            <i class="fab fa-twitter-x"></i>
                        </a>
                        <a href="https://www.linkedin.com" target="_blank" title="LinkedIn">
                            <i class="fab fa-linkedin-in"></i>
                        </a>
                        <a href="https://www.instagram.com" target="_blank" title="Instagram">
                            <i class="fab fa-instagram"></i>
                        </a>
                        <a href="https://www.youtube.com" target="_blank" title="YouTube">
                            <i class="fab fa-youtube"></i>
                        </a>
                        <a href="https://www.github.com" target="_blank" title="GitHub">
                            <i class="fab fa-github"></i>
                        </a>
                        <a href="https://www.google.com" target="_blank" title="Google">
                            <i class="fab fa-google"></i>
                        </a>
                    </div>
                </div>

                <!-- Signup Footer -->
                <div class="login-footer">
                    <p>Already have an account? <a href="login.html">Sign in</a></p>
                    <a href="index.html" class="back-home">
                        ← Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
